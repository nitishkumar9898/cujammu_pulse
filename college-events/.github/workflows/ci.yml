name: Backend CI

on:
  push:
    branches: [ master ]
    paths: [ 'college-events/**' ]
  pull_request:
    branches: [ master ]
    paths: [ 'college-events/**' ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('college-events/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Maven Verify
        run: mvn -f college-events/pom.xml verify -B -q

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-results
          path: college-events/target/surefire-reports/**/*.xml

      - name: Upload Test Reports (Failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: college-events/target/surefire-reports/

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            college-events/target/surefire-reports/**/*.xml