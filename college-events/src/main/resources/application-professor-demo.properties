# Explicitly isolated local review. No existing database, upload tree or provider is used.
app.professor-demo.enabled=${PROFESSOR_DEMO_ENABLED:false}
app.professor-demo.password=${PROFESSOR_DEMO_PASSWORD:}
spring.datasource.url=jdbc:h2:mem:pulse-professor-demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.jpa.show-sql=false
server.address=127.0.0.1
server.port=${PROFESSOR_DEMO_PORT:18080}
app.upload.dir=target/professor-demo/uploads
logging.file.name=target/professor-demo/logs/backend.log
logging.level.com.college.events=INFO
app.email.backend=console
chatbot.ai.enabled=false
app.identity.enabled=false
app.default-admin-password=
app.media.cleanup-cron=-
spring.cache.type=none
server.servlet.session.cookie.same-site=lax
app.client.dist=../cujammu-pulse/dist
