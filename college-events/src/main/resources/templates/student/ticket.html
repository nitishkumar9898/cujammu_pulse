<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>QR Ticket — CUJAMMU EVENTHUB</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: studentSidebar(activePage='tickets')}"></div>
<div class="main-content">
  <div th:replace="~{fragments/navbar :: topNav('QR Ticket')}"></div>
  <div class="page-content fade-in">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <a href="/student/my-tickets" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Back to My Tickets
      </a>
      <button class="btn btn-success btn-sm fw-semibold" onclick="window.print()">
        <i class="bi bi-printer me-1"></i>Print Ticket
      </button>
    </div>

    <div class="ticket-card mx-auto">
      <!-- Header -->
      <div class="ticket-header">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <p class="small opacity-75 mb-1"><i class="bi bi-calendar-event-fill me-1"></i>CUJAMMU EVENTHUB · Entry Pass</p>
            <h4 class="fw-bold mb-0" th:text="${registration.event.title}">Event Title</h4>
          </div>
          <span class="badge bg-white text-success fw-bold"
                th:if="${registration.status.name() == 'REGISTERED'}">VALID</span>
          <span class="badge bg-white text-info fw-bold"
                th:if="${registration.status.name() == 'ATTENDED'}">USED</span>
        </div>
      </div>

      <!-- Body -->
      <div class="ticket-body">
        <!-- QR Code -->
        <div class="text-center mb-3">
          <div class="qr-wrapper">
            <img th:src="${qrDataUri}" alt="QR Code" class="rounded-3 border p-1"/>
          </div>
          <p class="text-muted small mt-2 mb-0">Show this QR code at the event entry</p>
        </div>

        <div class="ticket-divider"></div>

        <!-- Info rows -->
        <div class="row g-2 mt-2">
          <div class="col-6">
            <div class="text-muted ticket-label">Attendee</div>
            <div class="fw-semibold small" th:text="${registration.user.name}">Name</div>
          </div>
          <div class="col-6">
            <div class="text-muted ticket-label">Department</div>
            <div class="fw-semibold small" th:text="${registration.user.department}">Dept</div>
          </div>
          <div class="col-6">
            <div class="text-muted ticket-label">Enrollment No</div>
            <div class="fw-semibold small" th:text="${registration.user.enrollmentNo}">EnrollNo</div>
          </div>
          <div class="col-12">
            <div class="text-muted ticket-label">Date &amp; Time</div>
            <div class="fw-semibold small"
                 th:text="${#temporals.format(registration.event.eventDate,'EEEE, dd MMMM yyyy · hh:mm a')}">Date</div>
          </div>
          <div class="col-12">
            <div class="text-muted ticket-label">Venue</div>
            <div class="fw-semibold small" th:text="${registration.event.venue}">Venue</div>
          </div>
          <div class="col-12">
            <div class="text-muted ticket-label">Token</div>
            <code class="small token-break"
                  th:text="${registration.qrToken}">token</code>
          </div>
        </div>

        <div class="alert mt-3 mb-0 text-center py-2 cert-alert-sm"
             th:classappend="${registration.status.name() == 'ATTENDED'} ? 'alert-info' : 'alert-success'">
          <i class="bi bi-check-circle me-1"></i>
          <span th:if="${registration.status.name() == 'REGISTERED'}">Registration Confirmed</span>
          <span th:if="${registration.status.name() == 'ATTENDED'}">Attendance Marked ✓</span>
        </div>
      </div>
    </div>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:replace="~{fragments/navbar :: sidebarJs}"></script>
</body>
</html>
