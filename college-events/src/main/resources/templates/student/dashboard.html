<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Student Dashboard — CUJAMMU EVENTHUB</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link href="/css/style.css" rel="stylesheet"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: studentSidebar}"></div>

<div class="main-content">
  <div th:replace="~{fragments/navbar :: topNav('Student Dashboard')}"></div>

  <div class="page-content fade-in">
    <div th:replace="~{fragments/navbar :: alerts}"></div>

    <!-- Welcome Banner with Profile Picture -->
    <div class="card border-0 mb-4 text-white rounded-4 overflow-hidden dashboard-banner">
      <div class="card-body p-4 d-flex align-items-center justify-content-between flex-wrap gap-3">
        <div class="d-flex align-items-center gap-3">
          <div th:if="${user.profilePicture != null}" class="rounded-circle overflow-hidden flex-shrink-0 dashboard-avatar-container">
            <img th:src="'/uploads/' + ${user.profilePicture}" alt="Profile"
                 class="dashboard-avatar-img"/>
          </div>
          <div th:unless="${user.profilePicture != null}"
               class="rounded-circle bg-white bg-opacity-25 d-flex align-items-center justify-content-center flex-shrink-0 dashboard-avatar-container">
            <i class="bi bi-person-fill fs-3"></i>
          </div>
          <div>
            <h4 class="fw-bold mb-1">
              Hello, <span th:text="${user.name}">Student</span>! 👋
              <span class="badge bg-warning text-dark rounded-pill ms-2 fs-6 shadow-sm">
                <i class="bi bi-star-fill me-1"></i><span th:text="${user.gamificationPoints}">0</span> Pts
              </span>
            </h4>
            <p class="mb-0 opacity-90 small mt-1">
              <span th:text="${user.department}">Dept</span>
              <span th:if="${user.enrollmentNo != null}"> · <span th:text="${user.enrollmentNo}">EN123</span></span>
            </p>
          </div>
        </div>
        <a href="/student/events" class="btn btn-warning fw-bold px-4">
          <i class="bi bi-search me-2"></i>Browse Events
        </a>
      </div>
    </div>

    <!-- Stats -->
    <div class="row g-2 g-md-3 mb-4">
      <div class="col-6 col-sm-6 col-md-3">
        <div class="stat-card text-center">
          <div class="stat-icon bg-primary bg-opacity-10 mx-auto mb-2">
            <i class="bi bi-calendar-check text-primary"></i>
          </div>
          <div class="fw-bold fs-3" th:text="${upcomingCount}">0</div>
          <div class="text-muted small">Upcoming</div>
        </div>
      </div>
      <div class="col-6 col-sm-6 col-md-3">
        <div class="stat-card text-center">
          <div class="stat-icon bg-success bg-opacity-10 mx-auto mb-2">
            <i class="bi bi-check-circle text-success"></i>
          </div>
          <div class="fw-bold fs-3" th:text="${attendedCount}">0</div>
          <div class="text-muted small">Attended</div>
        </div>
      </div>
      <div class="col-6 col-sm-6 col-md-3">
        <div class="stat-card text-center">
          <div class="stat-icon bg-warning bg-opacity-10 mx-auto mb-2">
            <i class="bi bi-hourglass text-warning"></i>
          </div>
          <div class="fw-bold fs-3" th:text="${waitlistedCount}">0</div>
          <div class="text-muted small">Waitlisted</div>
        </div>
      </div>
      <div class="col-6 col-sm-6 col-md-3">
        <div class="stat-card text-center">
          <div class="stat-icon bg-info bg-opacity-10 mx-auto mb-2">
            <i class="bi bi-ticket-perforated text-info"></i>
          </div>
          <div class="fw-bold fs-3" th:text="${recentRegistrations.size()}">0</div>
          <div class="text-muted small">Total Registrations</div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <!-- Recent Registrations -->
      <div class="col-lg-7">
        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-header bg-transparent border-0 pt-4 px-4 d-flex justify-content-between align-items-center">
            <h6 class="fw-bold mb-0"><i class="bi bi-clock-history me-2 text-primary"></i>Recent Registrations</h6>
            <a href="/student/my-tickets" class="btn btn-sm btn-outline-primary">View All</a>
          </div>
          <div class="card-body px-4 pb-4">
            <div th:if="${#lists.isEmpty(recentRegistrations)}" class="text-center py-3 text-muted">
              <i class="bi bi-inbox display-5"></i>
              <p class="mt-2">No registrations yet. <a href="/student/events">Browse events!</a></p>
            </div>
            <div th:unless="${#lists.isEmpty(recentRegistrations)}">
              <div th:each="reg : ${recentRegistrations}"
                   class="d-flex align-items-center p-3 rounded-3 mb-2 bg-light">
                <div class="flex-grow-1">
                  <div class="fw-semibold small" th:text="${reg.event.title}">Event</div>
                  <div class="text-muted dashboard-date-text"
                       th:text="${#temporals.format(reg.event.eventDate,'dd MMM yyyy')}">Date</div>
                </div>
                <span class="badge rounded-pill ms-2"
                      th:classappend="${'status-' + reg.status.name().toLowerCase()}"
                      th:text="${reg.status.name()}">STATUS</span>
                <a th:if="${reg.status.name() == 'REGISTERED' or reg.status.name() == 'ATTENDED'}"
                   th:href="'/student/ticket/' + ${reg.id}"
                   class="btn btn-sm btn-outline-primary ms-2">
                  <i class="bi bi-qr-code"></i>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Featured Events -->
      <div class="col-lg-5">
        <div class="card border-0 shadow-sm rounded-4 h-100">
          <div class="card-header bg-transparent border-0 pt-4 px-4 d-flex justify-content-between align-items-center">
            <h6 class="fw-bold mb-0"><i class="bi bi-stars me-2 text-warning"></i>Featured Events</h6>
            <a href="/student/events" class="btn btn-sm text-primary fw-semibold p-0">See All</a>
          </div>
          <div class="card-body px-4 pb-4">
            <div th:if="${#lists.isEmpty(featuredEvents)}" class="text-center py-4 text-muted small">
              <i class="bi bi-calendar-x d-block fs-2 mb-2 opacity-25"></i>
              No upcoming events found.
            </div>
            <div th:each="ev : ${featuredEvents}"
                 class="d-flex gap-3 align-items-center mb-3 pb-3 border-bottom last-border-0">
              <div class="bg-warning bg-opacity-10 rounded-3 p-3 flex-shrink-0 text-center dashboard-date-badge">
                <div class="fw-bold text-warning lh-1" th:text="${#temporals.format(ev.eventDate,'dd')}">24</div>
                <div class="text-uppercase small text-warning opacity-75 dashboard-month-text" th:text="${#temporals.format(ev.eventDate,'MMM')}">OCT</div>
              </div>
              <div class="flex-grow-1 overflow-hidden">
                <div class="fw-bold text-truncate" th:text="${ev.title}">Event Title</div>
                <div class="text-muted text-truncate dashboard-venue-text">
                  <i class="bi bi-geo-alt me-1"></i><span th:text="${ev.venue}">Venue</span>
                </div>
              </div>
              <a th:href="'/student/events/' + ${ev.id}"
                 class="btn btn-primary btn-sm rounded-3 px-3">Join</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/navbar :: chatbot}"></div>
<script th:replace="~{fragments/navbar :: sidebarJs}"></script>
</body>
</html>
