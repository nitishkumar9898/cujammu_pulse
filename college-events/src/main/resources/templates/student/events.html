<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Browse Events — CUJAMMU EVENTHUB</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: studentSidebar(activePage='events')}"></div>
<div class="main-content">
  <div th:replace="~{fragments/navbar :: topNav('Browse Events')}"></div>
  <div class="page-content fade-in">

    <!-- Search + Filter bar -->
    <div class="card border-0 shadow-sm rounded-4 mb-4">
      <div class="card-body p-3">
        <form th:action="@{/student/events}" method="get" class="row g-2 align-items-end">
          <div class="col-md-5">
            <label class="form-label small fw-semibold mb-1">Search</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-search text-muted"></i></span>
              <input type="text" name="keyword" class="form-control"
                     th:value="${keyword}" placeholder="Search events by title, venue..."/>
            </div>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold mb-1">Category</label>
            <select name="categoryId" class="form-select">
              <option value="">All Categories</option>
              <option th:each="cat : ${categories}"
                      th:value="${cat.id}"
                      th:text="${cat.name}"
                      th:selected="${selectedCategory != null and selectedCategory == cat.id}">Cat</option>
            </select>
          </div>
          <div class="col-md-3 d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-grow-1 fw-semibold">
              <i class="bi bi-funnel me-1"></i>Filter
            </button>
            <a href="/student/events" class="btn btn-outline-secondary">
              <i class="bi bi-x-lg"></i>
            </a>
          </div>
        </form>
      </div>
    </div>

    <!-- Results count -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <p class="mb-0 text-muted small">
        <span th:text="${events.size()}">0</span> event(s) found
        <span th:if="${keyword != null and !#strings.isEmpty(keyword)}">
          for "<strong th:text="${keyword}"></strong>"
        </span>
      </p>
    </div>

    <!-- No results -->
    <div th:if="${#lists.isEmpty(events)}" class="text-center py-5">
      <i class="bi bi-calendar-x display-1 text-muted"></i>
      <h5 class="mt-3 text-muted">No events found</h5>
      <p class="text-muted">Try a different search term or clear the filters.</p>
      <a href="/student/events" class="btn btn-primary">Clear Filters</a>
    </div>

    <!-- Event cards -->
    <div class="row g-4" th:unless="${#lists.isEmpty(events)}">
      <div class="col-md-6 col-lg-4" th:each="event : ${events}">
        <div class="card h-100 border-0 shadow-sm hover-lift overflow-hidden rounded-4">
          <div class="position-relative">
            <img th:if="${event.bannerImage != null}"
                 th:src="'/uploads/' + ${event.bannerImage}"
                 class="card-img-top" style="height:170px;object-fit:cover" alt="Banner"/>
            <div th:unless="${event.bannerImage != null}"
                 class="d-flex align-items-center justify-content-center"
                 style="height:170px;background:linear-gradient(135deg,#6C63FF15,#3D35A015)">
              <i th:class="'bi ' + (${event.category != null} ? ${event.category.icon} : 'bi-calendar-event')"
                 style="font-size:2.8rem;opacity:.35"></i>
            </div>
            <span class="position-absolute top-0 end-0 m-2 badge"
                  th:classappend="${event.category != null} ? ${'bg-' + event.category.colorClass} : 'bg-primary'"
                  th:text="${event.category != null} ? ${event.category.name} : 'General'">Cat</span>
            <!-- Already registered badge -->
            <span th:if="${registeredEventIds.contains(event.id)}"
                  class="position-absolute top-0 start-0 m-2 badge bg-success">
              <i class="bi bi-check-circle me-1"></i>Registered
            </span>
          </div>
          <div class="card-body d-flex flex-column">
            <h6 class="fw-bold mb-1" th:text="${event.title}">Title</h6>
            <p class="text-muted small flex-grow-1 mb-2"
               th:text="${#strings.abbreviate(event.description, 80)}">Desc</p>
            <div class="text-muted" style="font-size:.8rem">
              <div class="mb-1"><i class="bi bi-calendar3 me-2 text-primary"></i>
                <span th:text="${#temporals.format(event.eventDate,'dd MMM yyyy, hh:mm a')}">Date</span>
              </div>
              <div class="mb-1"><i class="bi bi-geo-alt me-2 text-danger"></i>
                <span th:text="${event.venue}">Venue</span>
              </div>
              <div class="d-flex justify-content-between">
                <span><i class="bi bi-people me-1 text-success"></i><span th:text="${event.maxSeats}">0</span> seats</span>
                <span th:if="${event.fees > 0}" class="badge bg-warning text-dark"
                      th:text="'₹' + ${event.fees}">Fee</span>
                <span th:unless="${event.fees > 0}" class="badge bg-success">FREE</span>
              </div>
            </div>
          </div>
          <div class="card-footer bg-transparent border-0 pb-3 px-3">
            <a th:href="'/student/events/' + ${event.id}" class="btn btn-primary btn-sm w-100 fw-semibold">
              <i class="bi bi-eye me-1"></i>View Details
            </a>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:replace="~{fragments/navbar :: sidebarJs}"></script>
<!-- Chatbot Widget -->
<div th:replace="~{fragments/navbar :: chatbot}"></div>
<script>
// Debounce search — auto-submit after 300ms of no typing
(function(){
  const searchInput = document.querySelector('input[name="keyword"]');
  if (!searchInput) return;
  let timer = null;
  searchInput.addEventListener('input', function() {
    clearTimeout(timer);
    timer = setTimeout(function() {
      searchInput.closest('form').submit();
    }, 300);
  });
})();
</script>
</body>
</html>
