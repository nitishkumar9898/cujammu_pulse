<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Profile — CUJAMMU EVENTHUB</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: studentSidebar(activePage='profile')}"></div>
<div class="main-content">
  <div th:replace="~{fragments/navbar :: topNav('My Profile')}"></div>
  <div class="page-content fade-in">
    <div th:replace="~{fragments/navbar :: alerts}"></div>
    <div class="row g-4 profile-container">

      <!-- Profile card -->
      <div class="col-md-12">
        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-header border-0 pt-4 px-4 bg-transparent">
            <h6 class="fw-bold mb-0"><i class="bi bi-person-circle me-2 text-primary"></i>Profile Information</h6>
          </div>
          <div class="card-body p-4">
            <div class="d-flex align-items-center gap-3 mb-4">
              <!-- Clickable avatar — WhatsApp-style instant upload -->
              <div class="avatar-upload-wrapper" onclick="document.getElementById('avatarInput').click()" title="Click to change photo">
                <div th:if="${user.profilePicture != null and !#strings.isEmpty(user.profilePicture)}"
                     class="position-relative">
                  <img th:src="'/uploads/' + ${user.profilePicture}" id="avatarImg"
                       class="rounded-circle border border-3 border-primary profile-avatar" alt="Profile"/>
                </div>
                <div th:unless="${user.profilePicture != null and !#strings.isEmpty(user.profilePicture)}"
                     class="bg-primary rounded-circle d-flex align-items-center justify-content-center text-white fw-bold profile-avatar-letter" id="avatarLetter"
                     th:text="${#strings.substring(user.name,0,1).toUpperCase()}">A</div>
                <div class="avatar-overlay"><i class="bi bi-camera-fill"></i></div>
                <div class="avatar-spinner d-none" id="avatarSpinner"></div>
              </div>
              <input type="file" id="avatarInput" accept="image/jpeg,image/png,image/webp" class="d-none"
                     onchange="uploadAvatar(this)" title="Upload Avatar" aria-label="Upload Avatar"/>
              <div>
                <h5 class="fw-bold mb-0" th:text="${user.name}">Name</h5>
                <p class="text-muted mb-0 small" th:text="${user.email}">email</p>
                <span class="badge bg-primary mt-1" th:text="${user.role}">Role</span>
              </div>
            </div>
            <div id="avatarError" class="alert alert-danger small py-2 d-none mb-3"></div>
            <div id="avatarSuccess" class="alert alert-success small py-2 d-none mb-3"></div>

            <form th:action="@{/student/profile/update}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Full Name</label>
                  <input type="text" name="name" class="form-control" th:value="${user.name}" required title="Full Name" placeholder="Enter your name" aria-label="Full Name"/>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Email (read-only)</label>
                  <input type="email" class="form-control bg-light" th:value="${user.email}" disabled title="Email" placeholder="Email" aria-label="Email"/>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Department</label>
                  <input type="text" name="department" class="form-control" th:value="${user.department}" title="Department" placeholder="Enter department" aria-label="Department"/>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Phone</label>
                  <input type="tel" name="phone" class="form-control" th:value="${user.phone}" title="Phone Number" placeholder="Enter phone number" aria-label="Phone Number"/>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Enrollment / Roll No</label>
                  <input type="text" name="enrollmentNo" class="form-control" th:value="${user.enrollmentNo}"
                         placeholder="e.g. 2024CUJAM001"/>
                </div>
                <div class="col-12">
                  <button type="submit" class="btn btn-primary fw-semibold">
                    <i class="bi bi-save me-1"></i>Save Changes
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Change password -->
      <div class="col-md-12">
        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-header border-0 pt-4 px-4 bg-transparent">
            <h6 class="fw-bold mb-0"><i class="bi bi-lock me-2 text-warning"></i>Change Password</h6>
          </div>
          <div class="card-body p-4">
            <form th:action="@{/student/profile/change-password}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label fw-semibold">Current Password</label>
                  <input type="password" name="currentPassword" class="form-control" aria-label="Current Password" title="Current Password" placeholder="Enter current password" required/>
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-semibold">New Password</label>
                  <input type="password" name="newPassword" class="form-control" aria-label="New Password" title="New Password" placeholder="Enter new password" required minlength="8"/>
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-semibold">Confirm New</label>
                  <input type="password" name="confirmNewPassword" class="form-control" required title="Confirm Password" placeholder="Confirm new password" aria-label="Confirm Password"/>
                </div>
                <div class="col-12">
                  <button type="submit" class="btn btn-warning fw-semibold">
                    <i class="bi bi-shield-lock me-1"></i>Update Password
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:replace="~{fragments/navbar :: sidebarJs}"></script>
<script th:inline="javascript">
const csrfToken = /*[[${_csrf.token}]]*/ '';
const csrfParam = /*[[${_csrf.parameterName}]]*/ '_csrf';
const MAX_SIZE = 5 * 1024 * 1024; // 5MB

function uploadAvatar(input) {
  const file = input.files[0];
  if (!file) return;

  const errEl = document.getElementById('avatarError');
  const sucEl = document.getElementById('avatarSuccess');
  errEl.classList.add('d-none');
  sucEl.classList.add('d-none');

  // Validate type
  if (!['image/jpeg','image/png','image/webp'].includes(file.type)) {
    errEl.textContent = 'Only JPG, PNG, or WebP images are allowed.';
    errEl.classList.remove('d-none');
    input.value = '';
    return;
  }
  // Validate size
  if (file.size > MAX_SIZE) {
    errEl.textContent = 'Image must be less than 5 MB. Your file is ' + (file.size / 1024 / 1024).toFixed(1) + ' MB.';
    errEl.classList.remove('d-none');
    input.value = '';
    return;
  }

  // Show spinner
  document.getElementById('avatarSpinner').style.display = 'block';

  // Compress via Canvas then upload
  compressAndUpload(file);
}

function compressAndUpload(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const MAX_DIM = 512;
      let w = img.width, h = img.height;
      if (w > MAX_DIM || h > MAX_DIM) {
        if (w > h) { h = Math.round(h * MAX_DIM / w); w = MAX_DIM; }
        else { w = Math.round(w * MAX_DIM / h); h = MAX_DIM; }
      }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(function(blob) {
        const fd = new FormData();
        fd.append('file', blob, file.name);
        fd.append(csrfParam, csrfToken);

        fetch('/student/profile/picture/ajax', {
          method: 'POST',
          body: fd
        })
        .then(r => r.json())
        .then(data => {
          document.getElementById('avatarSpinner').style.display = 'none';
          if (data.success) {
            // Update avatar image instantly
            const wrapper = document.querySelector('.avatar-upload-wrapper');
            const letterEl = document.getElementById('avatarLetter');
            if (letterEl) letterEl.style.display = 'none';
            let imgEl = document.getElementById('avatarImg');
            if (!imgEl) {
              const div = document.createElement('div');
              div.className = 'position-relative';
              div.innerHTML = '<img id="avatarImg" class="rounded-circle border border-3 border-primary" style="width:72px;height:72px;object-fit:cover" alt="Profile"/>';
              wrapper.insertBefore(div, wrapper.firstChild);
              imgEl = document.getElementById('avatarImg');
            }
            imgEl.src = '/uploads/' + data.filename + '?t=' + Date.now();
            sucEl.innerHTML = '<i class="bi bi-check-circle me-1"></i>Profile picture updated!';
            sucEl.classList.remove('d-none');
            setTimeout(() => sucEl.classList.add('d-none'), 3000);
          } else {
            const errEl2 = document.getElementById('avatarError');
            errEl2.textContent = data.message || 'Upload failed.';
            errEl2.classList.remove('d-none');
          }
        })
        .catch(() => {
          document.getElementById('avatarSpinner').style.display = 'none';
          const errEl2 = document.getElementById('avatarError');
          errEl2.textContent = 'Network error. Please try again.';
          errEl2.classList.remove('d-none');
        });
      }, 'image/jpeg', 0.85);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
</script>
</body>
</html>
