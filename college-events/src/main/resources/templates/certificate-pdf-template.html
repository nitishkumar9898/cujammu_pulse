<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Certificate of Participation</title>
    <style>
        @page { size: A4 landscape; margin: 0; }
        body { font-family: 'Serif', 'Times New Roman', serif; margin: 0; padding: 0; background: #fff; }
        .cert-outer { width: 100%; height: 100%; padding: 40px; box-sizing: border-box; background: #f0f2f5; }
        .cert-inner { 
            border: 20px solid #1a202c; 
            height: 520px; 
            background: #fff; 
            padding: 30px; 
            position: relative; 
            text-align: center;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.05);
        }
        .cert-decoration { position: absolute; width: 120px; height: 120px; opacity: 0.1; }
        .top-left { top: 0; left: 0; border-top: 15px solid #1a202c; border-left: 15px solid #1a202c; }
        .bottom-right { bottom: 0; right: 0; border-bottom: 15px solid #1a202c; border-right: 15px solid #1a202c; }
        
        .header { margin-top: 10px; }
        .university-name { font-size: 22pt; color: #2d3748; font-weight: bold; text-transform: uppercase; letter-spacing: 3px; }
        .main-title { font-size: 48pt; color: #1a202c; margin: 20px 0 10px 0; font-weight: 900; text-transform: uppercase; letter-spacing: 5px; }
        .sub-title { font-size: 16pt; color: #718096; font-style: italic; }
        
        .content { margin: 30px 0; }
        .student-name { font-size: 38pt; color: #1a202c; font-weight: bold; border-bottom: 2px solid #e2e8f0; display: inline-block; padding: 0 40px 5px 40px; }
        .description { font-size: 14pt; color: #4a5568; margin: 20px 0; line-height: 1.6; }
        .event-name { font-size: 26pt; color: #2b6cb0; font-weight: 800; font-style: italic; }
        
        .footer { position: absolute; bottom: 50px; width: 100%; display: table; left: 0; padding: 0 60px; box-sizing: border-box; }
        .footer-item { display: table-cell; text-align: center; vertical-align: bottom; width: 33%; }
        .sign-line { border-top: 1px solid #718096; width: 180px; margin: 0 auto 5px auto; }
        .sign-text { font-size: 10pt; font-weight: bold; color: #2d3748; }
        
        .seal-box { position: relative; margin-bottom: -20px; }
        .seal-ring { width: 90px; height: 90px; border: 4px solid #d69e2e; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; }
        .seal-inner { color: #d69e2e; font-size: 34pt; }
        .seal-label { font-size: 8pt; color: #d69e2e; font-weight: bold; margin-top: 5px; }
        
        .verify-bar { position: absolute; bottom: 10px; width: 100%; font-size: 8pt; color: #a0aec0; text-align: center; left: 0; }
    </style>
</head>
<body>
    <div class="cert-outer">
        <div class="cert-inner">
            <div class="cert-decoration top-left"></div>
            <div class="cert-decoration bottom-right"></div>
            
            <div class="header">
                <div class="university-name">Central University of Jammu</div>
                <div class="main-title">Certificate</div>
                <div class="sub-title">of Participation</div>
            </div>
            
            <div class="content">
                <p class="description">This is to certify that</p>
                <div class="student-name" th:text="${userName}">Nitish Kumar</div>
                <p class="description">
                    has actively participated in the event<br/>
                    <span class="event-name" th:text="${eventTitle}">Tech Fusion 2024</span><br/>
                    held on <span th:text="${eventDate}">October 24, 2024</span>.
                </p>
            </div>
            
            <div class="footer">
                <div class="footer-item">
                    <div class="sign-line"></div>
                    <div class="sign-text">Event Coordinator</div>
                </div>
                <div class="footer-item">
                    <div class="seal-box">
                        <div class="seal-ring"><div class="seal-inner">★</div></div>
                        <div class="seal-label">OFFICIAL SEAL</div>
                    </div>
                </div>
                <div class="footer-item">
                    <div class="sign-line"></div>
                    <div class="sign-text">Registrar / Dean</div>
                </div>
            </div>
            
            <div class="verify-bar">
                Certificate ID: <span th:text="${certNo}">ID</span> 
                | Verify at: <span th:text="${verificationUrl}">url</span>
            </div>
        </div>
    </div>
</body>
</html>
