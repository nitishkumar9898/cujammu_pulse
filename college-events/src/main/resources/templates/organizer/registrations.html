<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Registrations — CUJAMMU PULSE</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: organizerSidebar(activePage='events')}"></div>
<div class="main-content">
  <div th:replace="~{fragments/navbar :: topNav('Event Registrations')}"></div>
  <div class="page-content fade-in">
    <div th:replace="~{fragments/navbar :: alerts}"></div>

    <!-- Event summary bar -->
    <div class="card border-0 shadow-sm rounded-4 mb-4 reg-gradient-header">
      <div class="card-body p-4 text-white">
        <div class="row align-items-center g-3">
          <div class="col-md-6">
            <h5 class="fw-bold mb-1" th:text="${event.title}">Title</h5>
            <p class="mb-0 opacity-90 small">
              <i class="bi bi-calendar3 me-1"></i>
              <span th:text="${#temporals.format(event.eventDate,'dd MMM yyyy, hh:mm a')}">Date</span>
              &nbsp;·&nbsp;
              <i class="bi bi-geo-alt me-1"></i>
              <span th:text="${event.venue}">Venue</span>
            </p>
          </div>
          <div class="col-md-6">
            <div class="row g-2 text-center">
              <div class="col-4">
                <div class="fw-bold fs-4" th:text="${confirmedCount}">0</div>
                <div class="small opacity-80">Confirmed</div>
              </div>
              <div class="col-4">
                <div class="fw-bold fs-4" th:text="${waitlistedCount}">0</div>
                <div class="small opacity-80">Waitlisted</div>
              </div>
              <div class="col-4">
                <div class="fw-bold fs-4" th:text="${availableSeats}">0</div>
                <div class="small opacity-80">Available</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Action buttons -->
    <div class="d-flex gap-2 flex-wrap mb-4">
      <a th:href="'/organizer/events/' + ${event.id} + '/export-csv'"
         class="btn btn-success fw-semibold">
        <i class="bi bi-file-earmark-spreadsheet me-2"></i>Export CSV
      </a>
      <a th:href="'/organizer/events/' + ${event.id} + '/certificates'"
         class="btn btn-info fw-semibold text-white">
        <i class="bi bi-award me-2"></i>Certificates
      </a>
      <span class="btn btn-outline-secondary disabled" aria-disabled="true" title="Custom announcement delivery is not available yet">
        <i class="bi bi-megaphone me-2"></i>Announcements unavailable
      </span>
      <a href="/organizer/events" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Back
      </a>
    </div>

    <!-- Registrations table -->
    <div class="card border-0 shadow-sm rounded-4">
      <div class="card-header bg-transparent border-0 pt-4 px-4">
        <h6 class="fw-bold mb-0">
          <i class="bi bi-people me-2 text-primary"></i>
          All Registrations (<span th:text="${registrations.size()}">0</span>)
        </h6>
      </div>
      <div class="card-body px-4 pb-4">
        <div th:if="${#lists.isEmpty(registrations)}" class="text-center py-4 text-muted">
          <i class="bi bi-inbox display-4"></i>
          <p class="mt-2">No registrations yet.</p>
        </div>
        <div class="table-responsive" th:unless="${#lists.isEmpty(registrations)}">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>#</th>
                <th>Student</th>
                <th>Department</th>
                <th>Registered At</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="reg, iter : ${registrations}">
                <td class="text-muted small" th:text="${iter.count}">1</td>
                <td>
                  <div class="fw-semibold small" th:text="${reg.user.name}">Name</div>
                  <div class="text-muted email-small" th:text="${reg.user.email}">email</div>
                </td>
                <td class="small text-muted" th:text="${reg.user.department}">Dept</td>
                <td class="small text-muted"
                    th:text="${#temporals.format(reg.registeredAt,'dd MMM, HH:mm')}">Time</td>
                <td>
                  <span class="badge rounded-pill"
                        th:classappend="${'status-' + reg.status.name().toLowerCase()}"
                        th:text="${reg.status.name()}">Status</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/navbar :: chatbot}"></div>
<script th:replace="~{fragments/navbar :: sidebarJs}"></script>
</body>
</html>
