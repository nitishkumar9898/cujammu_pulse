<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Organizer Dashboard — CUJAMMU PULSE</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: organizerSidebar(activePage='dashboard')}"></div>
<div class="main-content">
  <div th:replace="~{fragments/navbar :: topNav('Organizer Dashboard')}"></div>
  <div class="page-content fade-in">
    <div th:replace="~{fragments/navbar :: alerts}"></div>

    <!-- Welcome -->
    <div class="card border-0 mb-4 text-white rounded-4"
         style="background:#123149">
      <div class="card-body p-4 d-flex align-items-center justify-content-between flex-wrap gap-3">
        <div>
          <h4 class="fw-bold mb-1">Hello, <span th:text="${user.name}">Organizer</span>!</h4>
          <p class="mb-0 opacity-90">Manage your events and track registrations.</p>
        </div>
        <a href="/organizer/events/create" class="btn btn-warning fw-bold px-4">
          <i class="bi bi-plus-circle me-2"></i>New Event
        </a>
      </div>
    </div>

    <!-- Stats -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md">
        <div class="stat-card text-center">
          <div class="stat-icon bg-primary bg-opacity-10 mx-auto mb-2"><i class="bi bi-calendar3 text-primary"></i></div>
          <div class="fw-bold fs-3" th:text="${totalEvents}">0</div>
          <div class="text-muted small">Total Events</div>
        </div>
      </div>
      <div class="col-6 col-md">
        <div class="stat-card text-center">
          <div class="stat-icon bg-warning bg-opacity-10 mx-auto mb-2"><i class="bi bi-hourglass text-warning"></i></div>
          <div class="fw-bold fs-3" th:text="${pendingEvents}">0</div>
          <div class="text-muted small">Pending</div>
        </div>
      </div>
      <div class="col-6 col-md">
        <div class="stat-card text-center">
          <div class="stat-icon bg-success bg-opacity-10 mx-auto mb-2"><i class="bi bi-check-circle text-success"></i></div>
          <div class="fw-bold fs-3" th:text="${approvedEvents}">0</div>
          <div class="text-muted small">Approved</div>
        </div>
      </div>
      <div class="col-6 col-md">
        <div class="stat-card text-center">
          <div class="stat-icon bg-info bg-opacity-10 mx-auto mb-2"><i class="bi bi-people text-info"></i></div>
          <div class="fw-bold fs-3" th:text="${totalRegistrations}">0</div>
          <div class="text-muted small">Registrants</div>
        </div>
      </div>
      <div class="col-12 col-md">
        <div class="stat-card text-center">
          <div class="stat-icon bg-danger bg-opacity-10 mx-auto mb-2"><i class="bi bi-star-fill text-warning"></i></div>
          <div class="fw-bold fs-3" th:text="${avgRating}">0.0</div>
          <div class="text-muted small">Avg Rating</div>
        </div>
      </div>
    </div>

    <!-- Recent Events -->
    <div class="card border-0 shadow-sm rounded-4">
      <div class="card-header bg-transparent border-0 pt-4 px-4 d-flex justify-content-between">
        <h6 class="fw-bold mb-0"><i class="bi bi-calendar3 me-2 text-primary"></i>My Recent Events</h6>
        <a href="/organizer/events" class="btn btn-sm btn-outline-primary">View All</a>
      </div>
      <div class="card-body px-4 pb-4">
        <div th:if="${#lists.isEmpty(myEvents)}" class="text-center py-4 text-muted">
          <i class="bi bi-calendar-plus display-4"></i>
          <p class="mt-2">No events yet. <a href="/organizer/events/create">Create your first event!</a></p>
        </div>
        <div class="table-responsive" th:unless="${#lists.isEmpty(myEvents)}">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr><th>Event</th><th>Date</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody>
              <tr th:each="ev : ${myEvents}">
                <td>
                  <div class="fw-semibold small" th:text="${ev.title}">Title</div>
                  <div class="text-muted" style="font-size:.75rem" th:text="${ev.venue}">Venue</div>
                </td>
                <td class="small text-muted"
                    th:text="${#temporals.format(ev.eventDate,'dd MMM yyyy')}">Date</td>
                <td>
                  <span class="badge rounded-pill"
                        th:classappend="${'status-' + ev.status.name().toLowerCase()}"
                        th:text="${ev.status.name()}">Status</span>
                </td>
                <td>
                  <a th:href="'/organizer/events/' + ${ev.id} + '/registrations'"
                     class="btn btn-sm btn-outline-primary me-1">
                    <i class="bi bi-people"></i>
                  </a>
                  <a th:if="${ev.status.name() == 'APPROVED'}"
                     th:href="'/organizer/events/' + ${ev.id} + '/scan'"
                     class="btn btn-sm btn-outline-success">
                    <i class="bi bi-qr-code-scan"></i>
                  </a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/navbar :: chatbot}"></div>
<script th:replace="~{fragments/navbar :: sidebarJs}"></script>
</body>
</html>
