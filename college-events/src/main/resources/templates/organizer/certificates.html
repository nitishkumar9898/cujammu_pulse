<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Issue Certificates — CUJAMMU EVENTHUB</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: organizerSidebar(activePage='events')}"></div>
<div class="main-content">
  <div th:replace="~{fragments/navbar :: topNav('Issue Certificates')}"></div>
  <div class="page-content fade-in">
    <div th:replace="~{fragments/navbar :: alerts}"></div>

    <!-- Event Info -->
    <div class="card border-0 mb-4 rounded-4 text-white overflow-hidden cert-gradient-header">
      <div class="card-body p-4">
        <h5 class="fw-bold mb-1" th:text="${event.title}">Event</h5>
        <p class="mb-0 opacity-90 small">
          <i class="bi bi-calendar3 me-1"></i>
          <span th:text="${#temporals.format(event.eventDate,'dd MMM yyyy, hh:mm a')}">Date</span>
          &nbsp;·&nbsp;
          <i class="bi bi-people me-1"></i>
          <span th:text="${attendedCount}">0</span> students attended
          &nbsp;·&nbsp;
          <i class="bi bi-award me-1"></i>
          <span th:text="${certificates.size()}">0</span> certificates issued
        </p>
      </div>
    </div>

    <div class="row g-4">
      <!-- Template Selection -->
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-header bg-transparent border-0 pt-4 px-4">
            <h6 class="fw-bold mb-0"><i class="bi bi-palette me-2 text-primary"></i>Select Certificate Template</h6>
            <p class="text-muted small mb-0">Choose a design for certificates</p>
          </div>
          <div class="card-body p-4">
            <form th:action="'/organizer/events/' + ${event.id} + '/certificates/issue'" method="post" id="issueForm">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <div class="row g-3">
                <div class="col-6 col-md-4" th:each="entry : ${templates}">
                  <label class="w-100 cursor-pointer">
                    <input type="radio" name="templateId" th:value="${entry.key}" class="d-none template-radio"
                           th:checked="${entry.key == 'classic-blue'}"/>
                    <div class="border rounded-3 p-3 text-center template-card hover-lift"
                         th:id="'tmpl-' + ${entry.key}">
                      <div class="rounded-3 mx-auto mb-2 d-flex align-items-center justify-content-center text-white fw-bold cert-template-preview"
                           th:style="'width:60px;height:40px;font-size:1.4rem;background:linear-gradient(135deg,' + ${entry.value.primaryColor()} + ',' + ${entry.value.accentColor()} + ')'">
                        <span th:text="${entry.value.emoji()}">🔵</span>
                      </div>
                      <div class="fw-semibold small" th:text="${entry.value.name()}">Template</div>
                      <div class="text-muted cert-template-desc" th:text="${entry.value.description()}">Desc</div>
                    </div>
                  </label>
                </div>
              </div>
              <div class="mt-4 d-flex gap-2 align-items-center">
                <button type="submit" class="btn btn-primary fw-bold">
                  <i class="bi bi-send me-1"></i>Issue Certificates to All Attendees
                </button>
                <span class="text-muted small">
                  <i class="bi bi-info-circle me-1"></i>Certificates will be emailed to each attendee
                </span>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Issued Certificates List -->
      <div class="col-lg-4">
        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-header bg-transparent border-0 pt-4 px-4">
            <h6 class="fw-bold mb-0"><i class="bi bi-list-check me-2 text-success"></i>Issued Certificates</h6>
          </div>
          <div class="card-body p-4">
            <div th:if="${certificates.isEmpty()}" class="text-center text-muted py-3">
              <i class="bi bi-inbox display-4 opacity-25"></i>
              <p class="mt-2 mb-0 small">No certificates issued yet</p>
            </div>
            <div th:unless="${certificates.isEmpty()}">
              <div class="list-group list-group-flush">
                <div class="list-group-item px-0 py-2 border-0" th:each="cert : ${certificates}">
                  <div class="d-flex justify-content-between align-items-center">
                    <div>
                      <div class="fw-semibold small" th:text="${cert.user.name}">Student</div>
                      <div class="text-muted cert-number-small" th:text="${cert.certificateNumber}">CUJ-1</div>
                    </div>
                    <span class="badge" th:classappend="${cert.emailed} ? 'bg-success' : 'bg-secondary'"
                          th:text="${cert.emailed} ? '✉️ Sent' : 'Pending'">Status</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-3">
      <a th:href="'/organizer/events/' + ${event.id} + '/registrations'" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Back to Registrations
      </a>
    </div>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/navbar :: chatbot}"></div>
<script th:replace="~{fragments/navbar :: sidebarJs}"></script>
<script>
// Template card selection highlight
document.querySelectorAll('.template-radio').forEach(radio => {
  radio.addEventListener('change', () => {
    document.querySelectorAll('.template-card').forEach(c =>
      c.classList.remove('border-primary', 'bg-primary', 'bg-opacity-10'));
    if (radio.checked) {
      document.getElementById('tmpl-' + radio.value)
        .classList.add('border-primary', 'bg-primary', 'bg-opacity-10');
    }
  });
  // Initial highlight
  if (radio.checked) {
    document.getElementById('tmpl-' + radio.value)
      .classList.add('border-primary', 'bg-primary', 'bg-opacity-10');
  }
});
</script>
</body>
</html>
