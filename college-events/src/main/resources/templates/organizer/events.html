<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>My Events — CUJAMMU PULSE</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: organizerSidebar}"></div>
<div class="main-content">
  <div th:replace="~{fragments/navbar :: topNav('My Events')}"></div>
  <div class="page-content fade-in">
    <div th:replace="~{fragments/navbar :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
      <p class="mb-0 text-muted"><span th:text="${events.size()}">0</span> event(s)</p>
      <a href="/organizer/events/create" class="btn btn-primary fw-semibold">
        <i class="bi bi-plus-circle me-1"></i>New Event
      </a>
    </div>

    <div th:if="${#lists.isEmpty(events)}" class="text-center py-5">
      <i class="bi bi-calendar-plus display-1 text-muted"></i>
      <h5 class="mt-3">No events yet</h5>
      <a href="/organizer/events/create" class="btn btn-primary mt-2">Create Your First Event</a>
    </div>

    <div class="row g-4" th:unless="${#lists.isEmpty(events)}">
      <div class="col-md-6 col-lg-4" th:each="ev : ${events}">
        <div class="card border-0 shadow-sm rounded-4 h-100 hover-lift">
          <div class="position-relative">
            <img th:if="${ev.bannerImage != null}" th:src="'/uploads/' + ${ev.bannerImage}"
                 class="card-img-top rounded-top-4" style="height:150px;object-fit:cover" alt="Banner"/>
            <div th:unless="${ev.bannerImage != null}"
                 class="d-flex align-items-center justify-content-center rounded-top-4"
                 style="height:150px;background:#f8f9fa">
              <i class="bi bi-calendar-event text-muted" style="font-size:2.5rem;opacity:.3"></i>
            </div>
            <span class="position-absolute top-0 end-0 m-2 badge rounded-pill"
                  th:classappend="${'status-' + ev.status.name().toLowerCase()}"
                  th:text="${ev.status.name()}">Status</span>
          </div>
          <div class="card-body p-3">
            <h6 class="fw-bold mb-1" th:text="${ev.title}">Title</h6>
            <p class="text-muted small mb-0">
              <i class="bi bi-calendar3 me-1 text-primary"></i>
              <span th:text="${#temporals.format(ev.eventDate,'dd MMM yyyy')}">Date</span>
            </p>
            <p class="text-muted small mb-2">
              <i class="bi bi-geo-alt me-1 text-danger"></i>
              <span th:text="${ev.venue}">Venue</span>
            </p>
            <!-- Postpone reason badge -->
            <div th:if="${ev.postponeReason != null}" class="alert alert-warning py-1 px-2 mb-2" style="font-size:.75rem">
              <i class="bi bi-info-circle me-1"></i>Postponed: <span th:text="${ev.postponeReason}"></span>
            </div>
          </div>
          <div class="card-footer bg-transparent border-0 pb-3 px-3">
            <div class="d-flex gap-2 flex-wrap">
              <a th:href="'/organizer/events/' + ${ev.id} + '/registrations'"
                 class="btn btn-sm btn-outline-primary flex-grow-1">
                <i class="bi bi-people me-1"></i>Registrations
              </a>
              <a th:if="${(ev.status.name() == 'PENDING' or ev.status.name() == 'REJECTED') and ev.approvedAt == null and ev.cancelledAt == null and ev.completedAt == null}"
                 th:href="'/organizer/events/' + ${ev.id} + '/edit'"
                 class="btn btn-sm btn-outline-secondary" title="Edit proposal" aria-label="Edit proposal">
                <i class="bi bi-pencil"></i>
              </a>
              <a th:if="${ev.status.name() == 'APPROVED'}"
                 th:href="'/organizer/events/' + ${ev.id} + '/scan'"
                 class="btn btn-sm btn-outline-success" title="QR Scanner">
                <i class="bi bi-qr-code-scan"></i>
              </a>
              <!-- CSV Export -->
              <a th:if="${ev.status.name() == 'APPROVED' or ev.status.name() == 'COMPLETED'}"
                 th:href="'/organizer/events/' + ${ev.id} + '/export-csv'"
                 class="btn btn-sm btn-outline-info" title="Export CSV">
                <i class="bi bi-filetype-csv"></i>
              </a>
            </div>
            <!-- Second row: Cancel / Postpone / Complete / Delete -->
            <div class="d-flex gap-2 flex-wrap mt-2">
              <!-- Cancel Event -->
              <form th:if="${ev.status.name() == 'APPROVED' or ev.status.name() == 'PENDING'}"
                    th:action="'/organizer/events/' + ${ev.id} + '/cancel'" method="post" class="flex-grow-1"
                    onsubmit="return confirm('⚠️ Cancel this event? All registered students will be notified via email.')">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-sm btn-outline-danger w-100">
                  <i class="bi bi-x-circle me-1"></i>Cancel Event
                </button>
              </form>
              <!-- Postpone Event -->
              <a th:if="${ev.status.name() == 'APPROVED'}"
                 th:href="'/organizer/events/' + ${ev.id} + '/postpone'"
                 class="btn btn-sm btn-outline-warning flex-grow-1">
                <i class="bi bi-calendar-x me-1"></i>Postpone
              </a>
              <!-- Mark Completed -->
              <form th:if="${ev.status.name() == 'APPROVED'}"
                    th:action="'/organizer/events/' + ${ev.id} + '/complete'" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-sm btn-success" title="Mark Completed">
                  <i class="bi bi-check-all"></i>
                </button>
              </form>
              <!-- Delete Event -->
              <span class="small text-muted">Event history is retained. Permanent deletion is unavailable.</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/navbar :: chatbot}"></div>
<script th:replace="~{fragments/navbar :: sidebarJs}"></script>
</body>
</html>
