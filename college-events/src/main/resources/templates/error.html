<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Something Went Wrong — CUJAMMU EVENTHUB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <style>
        body { background: #f8f9fc; font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
        .error-card { max-width: 500px; padding: 40px; background: #fff; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
        .error-icon { font-size: 5rem; background: linear-gradient(135deg, #6C63FF, #3D35A0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
        .status-code { font-size: 1.2rem; font-weight: bold; color: #6C63FF; text-transform: uppercase; letter-spacing: 2px; }
        h1 { font-weight: 800; color: #1e293b; }
        p { color: #64748b; font-size: 1.1rem; }
        .btn-home { background: #6C63FF; color: #fff; border: none; padding: 12px 32px; border-radius: 12px; font-weight: 600; transition: all 0.3s; margin-top: 20px; text-decoration: none; display: inline-block; }
        .btn-home:hover { background: #5a52e0; color: #fff; transform: translateY(-2px); box-shadow: 0 8px 15px rgba(108,99,255,0.3); }
        .footer-text { margin-top: 30px; font-size: 0.85rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="status-code" th:text="${status != null ? status : 'Oops!'}">404</div>
        <div class="error-icon"><i class="bi bi-exclamation-triangle-fill"></i></div>
        <h1 th:text="${status == 404 ? 'Page Not Found' : 'Something Went Wrong'}">Page Not Found</h1>
        <p th:text="${message != null ? message : 'We couldn\'t find the page you were looking for, or something unexpected happened on our end.'}">
            We couldn't find the page you were looking for.
        </p>
        <a href="/" class="btn-home"><i class="bi bi-house-door me-2"></i>Back to Home</a>
        <div class="footer-text">
            CUJAMMU EVENTHUB Technical Support<br/>
            &copy; 2024 Central University of Jammu
        </div>
    </div>
</body>
</html>
