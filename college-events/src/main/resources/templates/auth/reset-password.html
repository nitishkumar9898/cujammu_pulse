<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password – CUJAMMU PULSE</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head>
<body class="auth-page">
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <img th:src="@{/images/cujammu_logo_circle.png}" src="/images/cujammu_logo_circle.png" class="auth-logo-mark" width="56" height="56" alt="Central University of Jammu seal"/>
      <h1 class="auth-brand">CUJAMMU PULSE</h1>
      <p class="auth-subtitle">Central University of Jammu</p>
    </div>
    <div class="auth-body">
      <h4 class="mb-1 fw-bold"><i class="bi bi-shield-lock me-2 text-success"></i>Reset Password</h4>

      <!-- Error (no token / expired) -->
      <div th:if="${errorMsg}" class="alert alert-danger" role="alert">
        <i class="bi bi-x-circle-fill me-2"></i><span th:text="${errorMsg}"></span>
        <div class="mt-2">
          <a th:href="@{/forgot-password}" class="btn btn-sm btn-outline-danger">
            <i class="bi bi-arrow-repeat me-1"></i>Request New Link
          </a>
        </div>
      </div>

      <!-- Flash success -->
      <div th:if="${successMsg}" class="alert alert-success" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMsg}"></span>
      </div>

      <!-- Reset form (only shown when token is valid) -->
      <div th:if="${token}">
        <p class="text-muted mb-4" style="font-size:14px">
          Setting new password for: <strong th:text="${userEmail}">user@example.com</strong>
        </p>
        <form th:action="@{/reset-password}" method="post" id="resetForm">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="hidden" name="token" th:value="${token}"/>

          <div class="mb-3">
            <label for="newPassword" class="form-label fw-semibold">New Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock-fill text-primary"></i></span>
              <input type="password" id="newPassword" name="newPassword" class="form-control"
                     placeholder="Min. 8 characters" minlength="8" required/>
              <button type="button" class="btn btn-outline-secondary" onclick="togglePwd('newPassword')">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div class="form-text">Must be at least 8 characters</div>
          </div>

          <div class="mb-4">
            <label for="confirmPassword" class="form-label fw-semibold">Confirm New Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock-fill text-primary"></i></span>
              <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                     placeholder="Repeat password" minlength="8" required/>
            </div>
            <div id="pwMatchMsg" class="form-text"></div>
          </div>

          <button type="submit" class="btn btn-success w-100 py-2 fw-bold">
            <i class="bi bi-check2-circle me-2"></i>Reset Password
          </button>
        </form>
      </div>

      <div class="text-center mt-3">
        <a th:href="@{/login}" class="text-decoration-none text-muted">
          <i class="bi bi-arrow-left me-1"></i>Back to Login
        </a>
      </div>
    </div>
  </div>
</div>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function togglePwd(id) {
    const el = document.getElementById(id);
    el.type = el.type === 'password' ? 'text' : 'password';
  }

  const np = document.getElementById('newPassword');
  const cp = document.getElementById('confirmPassword');
  const msg = document.getElementById('pwMatchMsg');
  function checkMatch() {
    if (!cp || !np || !msg) return;
    if (cp.value && np.value) {
      if (np.value === cp.value) { msg.className = 'form-text text-success'; msg.textContent = '✓ Passwords match'; }
      else { msg.className = 'form-text text-danger'; msg.textContent = '✗ Passwords do not match'; }
    } else { msg.textContent = ''; }
  }
  if(np) np.addEventListener('input', checkMatch);
  if(cp) cp.addEventListener('input', checkMatch);
</script>
</body>
</html>
