<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password – CUJAMMU EVENTHUB</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head>
<body class="auth-page">
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <i class="bi bi-calendar-event-fill auth-logo-icon"></i>
      <h1 class="auth-brand">CUJAMMU EVENTHUB</h1>
      <p class="auth-subtitle">Central University of Jammu</p>
    </div>
    <div class="auth-body">
      <h4 class="mb-1 fw-bold"><i class="bi bi-key me-2 text-primary"></i>Forgot Password?</h4>
      <p class="text-muted mb-4" style="font-size:14px">Enter your registered email and we'll generate a password reset link for you.</p>

      <!-- Alerts -->
      <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-x-circle-fill me-2"></i>
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <form th:action="@{/forgot-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email Address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope-fill text-primary"></i></span>
            <input type="email" id="email" name="email" class="form-control"
                   placeholder="your.email@cujammu.ac.in" required autofocus/>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3">
          <i class="bi bi-send-fill me-2"></i>Send Reset Link
        </button>
      </form>

      <div class="text-center mt-3">
        <a th:href="@{/login}" class="text-decoration-none text-muted">
          <i class="bi bi-arrow-left me-1"></i>Back to Login
        </a>
      </div>
    </div>
  </div>
</div>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
