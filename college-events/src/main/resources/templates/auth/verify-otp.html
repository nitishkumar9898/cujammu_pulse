<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Verify Email — CUJAMMU PULSE</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link href="/css/style.css" rel="stylesheet"/>
<style>
  .otp-input { width:52px;height:60px;text-align:center;font-size:1.8rem;font-weight:700;
    border:2px solid #dee2e6;border-radius:8px;transition:all .2s;caret-color:#173e59; }
  .otp-input:focus { border-color:#173e59;box-shadow:0 0 0 3px rgba(23,62,89,.18);outline:3px solid #b98b36;outline-offset:2px; }
  .otp-input.filled { border-color:#173e59;background:#edf2f5; }
  .countdown { font-size:2.5rem;font-weight:800;font-variant-numeric:tabular-nums; }
  .countdown.warning { color:#dc3545; }
  .ring { width:100px;height:100px;border-radius:50%;border:4px solid #e9ecef;position:relative; }
  .ring-fill { position:absolute;inset:-4px;border-radius:50%;border:4px solid #173e59;
    clip-path:polygon(50% 0%,100% 0%,100% 100%,0% 100%,0% 0%);transition:clip-path 1s linear; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
  .pulse { animation:pulse 2s infinite; }
  
  .auth-container { max-width: 480px; }
  .brand-text {
    color: #123149;
  }
  .icon-circle { width: 72px; height: 72px; }
  .btn-gradient { background: #173e59; border: 1px solid #173e59; }
</style>
</head>
<body class="auth-bg d-flex align-items-center justify-content-center min-vh-100">
<div class="container auth-container">
  <div class="text-center mb-4">
    <a href="/" class="text-decoration-none">
      <img th:src="@{/images/cujammu_logo_circle.png}" src="/images/cujammu_logo_circle.png" width="54" height="54" alt="Central University of Jammu seal" style="object-fit:contain;vertical-align:middle"/>
      <span class="fw-bold fs-4 ms-2 brand-text">CUJAMMU PULSE</span>
    </a>
  </div>

  <div class="card border-0 shadow-lg rounded-4">
    <div class="card-body p-4 p-md-5 text-center">
      <div class="mb-3">
        <div class="bg-primary bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center icon-circle">
          <i class="bi bi-envelope-check text-primary fs-2"></i>
        </div>
      </div>
      <h4 class="fw-bold mb-1">Verify Your Email</h4>
      <p class="text-muted small mb-1">We've sent a 6-digit code to</p>
      <p class="fw-semibold text-primary mb-3" th:text="${email}">email@example.com</p>

      <div th:if="${errorMsg}" class="alert alert-danger small py-2">
        <i class="bi bi-exclamation-triangle-fill me-1"></i><span th:text="${errorMsg}"></span>
      </div>

      <div th:if="${successMsg}" class="alert alert-success small py-2">
        <i class="bi bi-check-circle-fill me-1"></i><span th:text="${successMsg}"></span>
      </div>

      <div th:if="${warningMsg}" class="alert alert-warning small py-2">
        <i class="bi bi-exclamation-triangle-fill me-1"></i><span th:text="${warningMsg}"></span>
      </div>

      <!-- Countdown Timer -->
      <div class="mb-4">
        <div class="countdown" id="countdown">02:00</div>
        <p class="text-muted small mb-0">Time remaining</p>
      </div>

      <!-- OTP Input -->
      <form th:action="@{/register/verify-otp}" method="post" id="otpForm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="otp" id="otpHidden"/>
        <div class="d-flex justify-content-center gap-2 mb-4" id="otpContainer">
          <input type="text" class="otp-input" aria-label="OTP Digit 1" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off"/>
          <input type="text" class="otp-input" aria-label="OTP Digit 2" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off"/>
          <input type="text" class="otp-input" aria-label="OTP Digit 3" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off"/>
          <input type="text" class="otp-input" aria-label="OTP Digit 4" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off"/>
          <input type="text" class="otp-input" aria-label="OTP Digit 5" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off"/>
          <input type="text" class="otp-input" aria-label="OTP Digit 6" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off"/>
        </div>
        <button type="submit" class="btn btn-lg w-100 fw-bold text-white mb-3 btn-gradient" id="verifyBtn">
          <i class="bi bi-shield-check me-2"></i>Verify & Create Account
        </button>
      </form>

      <!-- Resend -->
      <div class="mt-2">
        <button class="btn btn-link text-decoration-none fw-semibold" id="resendBtn" disabled onclick="resendOtp()">
          <i class="bi bi-arrow-repeat me-1"></i>Resend Code
        </button>
        <div id="resendMsg" class="small mt-1"></div>
      </div>

      <div class="mt-3">
        <a href="/register" class="text-muted small"><i class="bi bi-arrow-left me-1"></i>Back to Registration</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
const initialSeconds = /*[[${remainingSeconds}]]*/ 120;
const csrfToken = /*[[${_csrf.token}]]*/ '';
const csrfParam = /*[[${_csrf.parameterName}]]*/ '_csrf';
const csrfHeader = /*[[${_csrf.headerName}]]*/ 'X-CSRF-TOKEN';

// OTP Input Logic
const inputs = document.querySelectorAll('.otp-input');
const otpHidden = document.getElementById('otpHidden');
const form = document.getElementById('otpForm');

inputs.forEach((inp, i) => {
  inp.addEventListener('input', e => {
    const val = e.target.value.replace(/[^0-9]/g, '');
    e.target.value = val;
    if (val) {
      e.target.classList.add('filled');
      if (i < inputs.length - 1) inputs[i + 1].focus();
    }
    updateHidden();
    // Auto-submit when all filled
    if (getOtp().length === 6) {
      document.getElementById('verifyBtn').click();
    }
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !e.target.value && i > 0) {
      inputs[i - 1].focus();
      inputs[i - 1].value = '';
      inputs[i - 1].classList.remove('filled');
    }
  });
  inp.addEventListener('paste', e => {
    e.preventDefault();
    const paste = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
    paste.split('').forEach((ch, idx) => {
      if (inputs[idx]) { inputs[idx].value = ch; inputs[idx].classList.add('filled'); }
    });
    updateHidden();
    if (paste.length >= 6) inputs[5].focus();
  });
});
inputs[0].focus();

function getOtp() { return Array.from(inputs).map(i => i.value).join(''); }
function updateHidden() { otpHidden.value = getOtp(); }
form.addEventListener('submit', () => updateHidden());

// Countdown Timer
let remaining = Math.max(0, initialSeconds);
const countdownEl = document.getElementById('countdown');
const resendBtn = document.getElementById('resendBtn');

function updateCountdown() {
  const m = Math.floor(remaining / 60);
  const s = remaining % 60;
  countdownEl.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  if (remaining <= 30) countdownEl.classList.add('warning');
  if (remaining <= 0) {
    countdownEl.textContent = '00:00';
    countdownEl.classList.add('warning');
    resendBtn.disabled = false;
    resendBtn.classList.add('pulse');
    return;
  }
  remaining--;
  setTimeout(updateCountdown, 1000);
}
updateCountdown();

// Resend OTP
function showResendMessage(message, className) {
  const status = document.createElement('span');
  status.className = className;
  status.textContent = typeof message === 'string' ? message : 'Unable to resend code. Please try again.';
  document.getElementById('resendMsg').replaceChildren(status);
}
function resendOtp() {
  resendBtn.disabled = true;
  resendBtn.classList.remove('pulse');
  showResendMessage('Sending...', 'text-muted');

  fetch('/register/resend-otp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded', [csrfHeader]: csrfToken },
    body: csrfParam + '=' + encodeURIComponent(csrfToken)
  })
  .then(r => r.json())
  .then(data => {
    if (data.success) {
      remaining = data.remainingSeconds || 120;
      countdownEl.classList.remove('warning');
      showResendMessage(data.message, 'text-success');
      updateCountdown();
      inputs.forEach(i => { i.value = ''; i.classList.remove('filled'); });
      inputs[0].focus();
    } else {
      showResendMessage(data.message, 'text-danger');
      resendBtn.disabled = false;
    }
  })
  .catch(() => {
    showResendMessage('Network error. Try again.', 'text-danger');
    resendBtn.disabled = false;
  });
}
</script>
</body>
</html>
