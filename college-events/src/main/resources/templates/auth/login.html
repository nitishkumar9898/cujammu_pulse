<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sign in — CUJAMMU PULSE</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link href="/css/style.css" rel="stylesheet"/>
<style>
  .login-card-wrapper { max-width: 900px; }
  .login-sidebar-bg { background: #123149; }
  .login-icon-lg { font-size: 3.5rem; }
  .btn-login-gradient { background: #173e59; border: 1px solid #173e59; }
  .login-mobile-brand img { width: 54px; height: 54px; object-fit: contain; }
  .login-mobile-brand { color: #123149; }
</style>
</head>
<body class="auth-bg">
<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center p-3">
  <div class="row w-100 shadow-lg rounded-4 overflow-hidden login-card-wrapper">

    <div class="col-lg-5 d-none d-lg-flex flex-column align-items-center justify-content-center text-white p-5 login-sidebar-bg">
      <img th:src="@{/images/cujammu_logo_circle.png}" src="/images/cujammu_logo_circle.png" alt="Central University of Jammu seal" style="width: 110px; height: 110px; object-fit: contain; border-radius: 50%; background: #ffffff; padding: 4px;">
      <h3 class="fw-bold mt-3 mb-0 text-center">CUJAMMU<span style="color: #D4AF37;">-PULSE</span></h3>
      <p class="text-center opacity-80 small mb-4">Central University of Jammu</p>
      <div class="mt-2 w-100">
        <div class="d-flex align-items-center gap-3 bg-white bg-opacity-10 rounded-3 p-2 px-3 mb-2">
          <i class="bi bi-calendar-check fs-5"></i><span class="small">Event Registrations</span>
        </div>
        <div class="d-flex align-items-center gap-3 bg-white bg-opacity-10 rounded-3 p-2 px-3 mb-2">
          <i class="bi bi-book fs-5"></i><span class="small">Library and study services</span>
        </div>
        <div class="d-flex align-items-center gap-3 bg-white bg-opacity-10 rounded-3 p-2 px-3">
          <i class="bi bi-building fs-5"></i><span class="small">Campus spaces and support</span>
        </div>
      </div>
    </div>

    <div class="col-lg-7 bg-white p-4 p-md-5">
      <div class="login-mobile-brand d-flex d-lg-none align-items-center gap-3 mb-4">
        <img th:src="@{/images/cujammu_logo_circle.png}" src="/images/cujammu_logo_circle.png" alt="Central University of Jammu seal">
        <div><div class="fw-bold">CUJAMMU PULSE</div><div class="small text-muted">Central University of Jammu</div></div>
      </div>
      <div class="text-center mb-4">
        <h3 class="fw-bold">Welcome Back!</h3>
        <p class="text-muted">Sign in to your campus workspace</p>
      </div>

      <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close Error"></button>
      </div>
      <div th:if="${logoutMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${logoutMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close Logout Message"></button>
      </div>
      <div th:if="${successMsg}" class="alert alert-success" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMsg}"></span>
      </div>

      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label class="form-label fw-semibold">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
            <input type="email" name="username" class="form-control form-control-lg"
                   placeholder="you@college.edu" required autofocus/>
          </div>
        </div>
        <div class="mb-2">
          <label class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-lock text-muted"></i></span>
            <input type="password" name="password" id="pwdInput"
                   class="form-control form-control-lg" placeholder="Enter password" required/>
            <button type="button" class="btn btn-outline-secondary" onclick="togglePwd()" aria-label="Toggle password visibility">
              <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>
        <!-- Forgot Password Link -->
        <div class="text-end mb-3">
          <a th:href="@{/forgot-password}" class="text-primary text-decoration-none small fw-semibold">
            <i class="bi bi-key me-1"></i>Forgot Password?
          </a>
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mb-3 btn-login-gradient">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
      </form>

      <div class="text-center mb-3">
        <span class="text-muted">Don't have an account?</span>
        <a href="/register" class="text-primary fw-semibold ms-1">Create Account</a>
      </div>
      </div>
    </div>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/theme-switcher.js"></script>
<script>
function togglePwd(){
  const i=document.getElementById('pwdInput'),e=document.getElementById('eyeIcon');
  if(i.type==='password'){i.type='text';e.className='bi bi-eye-slash';}
  else{i.type='password';e.className='bi bi-eye';}
}
</script>
</body>
</html>
