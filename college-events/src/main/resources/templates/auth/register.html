<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Register — CUJAMMU EVENTHUB</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link href="/css/style.css" rel="stylesheet"/>
</head>
<body class="auth-bg py-4">
<div class="container" style="max-width:560px">
  <div class="text-center mb-4">
    <a href="/" class="text-decoration-none">
      <i class="bi bi-calendar-event-fill text-primary fs-2"></i>
      <span class="fw-bold fs-4 ms-2" style="background:linear-gradient(135deg,#6C63FF,#3D35A0);-webkit-background-clip:text;-webkit-text-fill-color:transparent">CUJAMMU EVENTHUB</span>
    </a>
  </div>

  <div class="card border-0 shadow-lg rounded-4">
    <div class="card-body p-4 p-md-5">
      <h4 class="fw-bold text-center mb-1">Create Your Account</h4>
      <p class="text-muted text-center small mb-4">Join the Central University of Jammu event ecosystem</p>

      <div th:if="${errorMsg}" class="alert alert-danger">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMsg}"></span>
      </div>

      <form th:action="@{/register}" method="post" th:object="${dto}" novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
          <label class="form-label fw-semibold">Full Name *</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-person text-muted"></i></span>
            <input type="text" th:field="*{name}" class="form-control"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                   placeholder="Your full name" required/>
            <div class="invalid-feedback" th:errors="*{name}">Name error</div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Email Address *</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
            <input type="email" th:field="*{email}" class="form-control"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                   placeholder="you@cujammu.ac.in" required/>
            <div class="invalid-feedback" th:errors="*{email}">Email error</div>
          </div>
          <div class="form-text">Use your university email for best experience</div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">I am a *</label>
          <div class="d-flex gap-3">
            <div th:each="role : ${roles}" class="form-check flex-grow-1">
              <label class="form-check-label w-100">
                <div class="border rounded-3 p-3 text-center role-card"
                     th:id="${'role-' + role.name()}">
                  <i th:class="'bi fs-3 d-block mb-1 ' + (${role.name() == 'STUDENT'} ? 'bi-mortarboard' : 'bi-person-workspace')"></i>
                  <span class="fw-semibold" th:text="${role.name()}">Role</span>
                  <input type="radio" th:field="*{role}" th:value="${role}" class="d-none role-radio"
                         th:id="${'r-' + role.name()}"/>
                </div>
              </label>
            </div>
          </div>
          <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Department *</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-building text-muted"></i></span>
            <input type="text" th:field="*{department}" class="form-control"
                   th:classappend="${#fields.hasErrors('department')} ? 'is-invalid'"
                   placeholder="e.g. Computer Science" required/>
            <div class="invalid-feedback" th:errors="*{department}">Dept error</div>
          </div>
        </div>

        <!-- Enrollment Number (for Students) -->
        <div class="mb-3" id="enrollmentField">
          <label class="form-label fw-semibold">Enrollment / Roll Number</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-card-text text-muted"></i></span>
            <input type="text" th:field="*{enrollmentNo}" class="form-control"
                   placeholder="e.g. CUJ/2023/CS/001"/>
          </div>
          <div class="form-text">Required for students — this will appear on your QR ticket</div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Phone Number</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-telephone text-muted"></i></span>
            <input type="tel" th:field="*{phone}" class="form-control"
                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                   placeholder="10-digit phone number"/>
            <div class="invalid-feedback" th:errors="*{phone}">Phone error</div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Password *</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-lock text-muted"></i></span>
            <input type="password" th:field="*{password}" id="pwd1" class="form-control"
                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                   placeholder="Min 8 chars, upper+lower+digit" required/>
            <button type="button" class="btn btn-outline-secondary" onclick="togglePwd('pwd1','e1')">
              <i class="bi bi-eye" id="e1"></i></button>
            <div class="invalid-feedback" th:errors="*{password}">Pwd error</div>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Confirm Password *</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-lock-fill text-muted"></i></span>
            <input type="password" th:field="*{confirmPassword}" id="pwd2" class="form-control"
                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                   placeholder="Re-enter password" required/>
            <button type="button" class="btn btn-outline-secondary" onclick="togglePwd('pwd2','e2')">
              <i class="bi bi-eye" id="e2"></i></button>
            <div class="invalid-feedback" th:errors="*{confirmPassword}">Confirm error</div>
          </div>
        </div>

        <button type="submit" class="btn btn-lg w-100 fw-bold text-white"
                style="background:linear-gradient(135deg,#6C63FF,#3D35A0);border:none">
          <i class="bi bi-person-plus me-2"></i>Create Account
        </button>
      </form>

      <div class="text-center mt-3">
        <span class="text-muted">Already registered?</span>
        <a href="/login" class="text-primary fw-semibold ms-1">Sign In</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePwd(inputId,iconId){
  const i=document.getElementById(inputId),e=document.getElementById(iconId);
  if(i.type==='password'){i.type='text';e.className='bi bi-eye-slash';}
  else{i.type='password';e.className='bi bi-eye';}
}
// Role card highlight
document.querySelectorAll('.role-radio').forEach(radio=>{
  radio.addEventListener('change',()=>{
    document.querySelectorAll('.role-card').forEach(c=>c.classList.remove('border-primary','bg-primary','bg-opacity-10'));
    if(radio.checked){
      document.getElementById('role-'+radio.value).classList.add('border-primary','bg-primary','bg-opacity-10');
    }
  });
});
</script>
</body>
</html>
