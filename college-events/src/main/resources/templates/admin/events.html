<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>All Events — CUJAMMU EVENTHUB Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: adminSidebar(activePage='events')}"></div>
<div class="main-content">
  <div th:replace="~{fragments/navbar :: topNav('All Events')}"></div>
  <div class="page-content fade-in">
    <div th:replace="~{fragments/navbar :: alerts}"></div>

    <!-- Filter bar -->
    <div class="card border-0 shadow-sm rounded-4 mb-4">
      <div class="card-body p-3">
        <form th:action="@{/admin/events}" method="get" class="d-flex gap-2 flex-wrap align-items-center">
          <label class="fw-semibold small me-1">Filter by status:</label>
          <a href="/admin/events"
             class="btn btn-sm"
             th:classappend="${selectedStatus == null} ? 'btn-dark' : 'btn-outline-secondary'">All</a>
          <a th:each="s : ${statuses}"
             th:href="'/admin/events?status=' + ${s.name()}"
             class="btn btn-sm"
             th:classappend="${selectedStatus != null and selectedStatus.toUpperCase() == s.name()} ? 'btn-dark' : 'btn-outline-secondary'"
             th:text="${s.name()}">Status</a>
        </form>
      </div>
    </div>

    <p class="text-muted small mb-3"><span th:text="${events.size()}">0</span> event(s) found</p>

    <div th:if="${#lists.isEmpty(events)}" class="text-center py-5">
      <i class="bi bi-calendar-x display-1 text-muted"></i>
      <p class="mt-3 text-muted">No events found.</p>
    </div>

    <div class="card border-0 shadow-sm rounded-4" th:unless="${#lists.isEmpty(events)}">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Event</th>
              <th>Organizer</th>
              <th>Date</th>
              <th>Category</th>
              <th>Seats</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="ev : ${events}">
              <td>
                <div class="fw-semibold small" th:text="${ev.title}">Title</div>
                <div class="text-muted" style="font-size:.72rem" th:text="${ev.venue}">Venue</div>
              </td>
              <td class="small" th:text="${ev.organizer.name}">Organizer</td>
              <td class="small text-muted"
                  th:text="${#temporals.format(ev.eventDate,'dd MMM yyyy')}">Date</td>
              <td>
                <span class="badge"
                      th:classappend="${'bg-' + (ev.category?.colorClass ?: 'secondary')}"
                      th:text="${ev.category?.name ?: '-'}">Cat</span>
              </td>
              <td class="small" th:text="${ev.maxSeats}">0</td>
              <td>
                <span class="badge rounded-pill"
                      th:classappend="${'status-' + ev.status.name().toLowerCase()}"
                      th:text="${ev.status.name()}">Status</span>
              </td>
              <td>
                <div class="d-flex gap-1">
                  <a th:href="'/admin/events/' + ${ev.id}"
                     class="btn btn-sm btn-outline-primary" title="View Details">
                    <i class="bi bi-eye"></i>
                  </a>
                  <a th:href="'/admin/events/' + ${ev.id} + '/export-csv'"
                     class="btn btn-sm btn-outline-success" title="Export CSV">
                    <i class="bi bi-file-earmark-spreadsheet"></i>
                  </a>
                  <form th:action="'/admin/events/' + ${ev.id} + '/delete'" method="post"
                        onsubmit="return confirm('Permanently delete this event?')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                      <i class="bi bi-trash"></i>
                    </button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:replace="~{fragments/navbar :: sidebarJs}"></script>
</body>
</html>
