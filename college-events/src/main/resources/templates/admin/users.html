<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Users — CUJAMMU PULSE Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: adminSidebar(activePage='users')}"></div>
<div class="main-content">
  <div th:replace="~{fragments/navbar :: topNav('User Management')}"></div>
  <div class="page-content fade-in">
    <div th:replace="~{fragments/navbar :: alerts}"></div>

    <!-- Filter -->
    <div class="card border-0 shadow-sm rounded-4 mb-4">
      <div class="card-body p-3 d-flex gap-2 flex-wrap align-items-center">
        <span class="fw-semibold small me-1">Filter:</span>
        <a href="/admin/users"
           class="btn btn-sm"
           th:classappend="${selectedRole == null} ? 'btn-dark' : 'btn-outline-secondary'">All</a>
        <a href="/admin/users?role=STUDENT"
           class="btn btn-sm"
           th:classappend="${selectedRole != null and selectedRole.toUpperCase()=='STUDENT'} ? 'btn-primary' : 'btn-outline-primary'">Students</a>
        <a href="/admin/users?role=ORGANIZER"
           class="btn btn-sm"
           th:classappend="${selectedRole != null and selectedRole.toUpperCase()=='ORGANIZER'} ? 'btn-success' : 'btn-outline-success'">Organizers</a>
        <span class="ms-auto text-muted small"><span th:text="${users.size()}">0</span> users</span>
      </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>#</th>
              <th>User</th>
              <th>Role</th>
              <th>Department</th>
              <th>Phone</th>
              <th>Joined</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="u, iter : ${users}"
                th:classappend="${!u.enabled} ? 'table-secondary opacity-75'">
              <td class="text-muted small" th:text="${iter.count}">1</td>
              <td>
                <div class="d-flex align-items-center gap-2">
                  <div class="rounded-circle d-flex align-items-center justify-content-center text-white fw-bold flex-shrink-0"
                       style="width:34px;height:34px;font-size:.8rem"
                       th:style="${'width:34px;height:34px;font-size:.8rem;background:' + (#strings.equals(u.role.name(),'STUDENT') ? '#173E59' : '#54788E')}"
                       th:text="${#strings.substring(u.name,0,1).toUpperCase()}">A</div>
                  <div>
                    <div class="fw-semibold small" th:text="${u.name}">Name</div>
                    <div class="text-muted" style="font-size:.72rem" th:text="${u.email}">email</div>
                  </div>
                </div>
              </td>
              <td>
                <span class="badge"
                      th:classappend="${u.role.name()=='STUDENT' ? 'bg-primary' : 'bg-success'}"
                      th:text="${u.role.name()}">Role</span>
              </td>
              <td class="small text-muted" th:text="${u.department ?: '-'}">Dept</td>
              <td class="small text-muted" th:text="${u.phone ?: '-'}">Phone</td>
              <td class="small text-muted"
                  th:text="${u.createdAt != null ? #temporals.format(u.createdAt,'dd MMM yyyy') : '-'}">Date</td>
              <td>
                <span th:if="${u.enabled}" class="badge bg-success">Active</span>
                <span th:unless="${u.enabled}" class="badge bg-danger">Blocked</span>
              </td>
              <td>
                <form th:action="'/admin/users/' + ${u.id} + '/toggle-status'" method="post">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit"
                          th:class="${u.enabled} ? 'btn btn-sm btn-outline-danger' : 'btn btn-sm btn-outline-success'"
                          th:title="${u.enabled} ? 'Block User' : 'Unblock User'"
                          th:onclick="return confirm(${u.enabled} ? 'Block this user?' : 'Unblock this user?')">
                    <i th:class="${u.enabled} ? 'bi bi-slash-circle' : 'bi bi-check-circle'"></i>
                  </button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div th:if="${#lists.isEmpty(users)}" class="text-center py-5 text-muted">
        <i class="bi bi-people display-4"></i>
        <p class="mt-2">No users found.</p>
      </div>
    </div>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:replace="~{fragments/navbar :: sidebarJs}"></script>
</body>
</html>
