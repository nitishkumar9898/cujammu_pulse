<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Categories — CUJAMMU EVENTHUB Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link href="/css/style.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: adminSidebar(activePage='categories')}"></div>
<div class="main-content">
  <div th:replace="~{fragments/navbar :: topNav('Event Categories')}"></div>
  <div class="page-content fade-in">
    <div th:replace="~{fragments/navbar :: alerts}"></div>

    <div class="row g-4">

      <!-- Add category form -->
      <div class="col-md-4">
        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-header bg-transparent border-0 pt-4 px-4">
            <h6 class="fw-bold mb-0"><i class="bi bi-plus-circle me-2 text-primary"></i>Add New Category</h6>
          </div>
          <div class="card-body p-4">
            <form th:action="@{/admin/categories/create}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <div class="mb-3">
                <label class="form-label fw-semibold">Category Name *</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. Cultural" required/>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Bootstrap Icon</label>
                <div class="input-group">
                  <span class="input-group-text"><i id="iconPreview" class="bi bi-tag"></i></span>
                  <input type="text" name="icon" id="iconInput" class="form-control"
                         value="bi-tag" placeholder="e.g. bi-music-note"
                         oninput="updateIcon(this.value)"/>
                </div>
                <div class="form-text">
                  <a href="https://icons.getbootstrap.com" target="_blank">Browse icons ↗</a>
                </div>
              </div>
              <div class="mb-4">
                <label class="form-label fw-semibold">Color</label>
                <div class="d-flex gap-2 flex-wrap" id="colorPicker">
                  <input type="hidden" name="colorClass" id="colorInput" value="primary"/>
                  <button type="button" th:each="c : ${ {'primary','success','danger','warning','info','secondary','dark'} }"
                          class="btn btn-sm color-btn"
                          th:classappend="${'btn-' + c}"
                          th:data-color="${c}"
                          th:text="${c}"
                          onclick="selectColor(this)"></button>
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100 fw-semibold">
                <i class="bi bi-plus-circle me-1"></i>Add Category
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- Existing categories -->
      <div class="col-md-8">
        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-header bg-transparent border-0 pt-4 px-4">
            <h6 class="fw-bold mb-0">
              <i class="bi bi-tags me-2 text-primary"></i>
              Existing Categories (<span th:text="${categories.size()}">0</span>)
            </h6>
          </div>
          <div class="card-body px-4 pb-4">
            <div th:if="${#lists.isEmpty(categories)}" class="text-muted text-center py-3">
              No categories yet.
            </div>
            <div class="row g-3" th:unless="${#lists.isEmpty(categories)}">
              <div class="col-sm-6" th:each="cat : ${categories}">
                <div class="d-flex align-items-center justify-content-between p-3 rounded-3 border hover-lift">
                  <div class="d-flex align-items-center gap-3">
                    <div class="rounded-3 d-flex align-items-center justify-content-center p-2"
                         th:classappend="${'bg-' + (cat.colorClass ?: 'primary') + ' bg-opacity-10'}">
                      <i th:class="'bi ' + (cat.icon ?: 'bi-tag') + ' fs-5 text-' + (cat.colorClass ?: 'primary')"></i>
                    </div>
                    <div>
                      <div class="fw-semibold small" th:text="${cat.name}">Name</div>
                      <div class="text-muted" style="font-size:.72rem" th:text="${cat.icon ?: '-'}">icon</div>
                    </div>
                  </div>
                  <form th:action="'/admin/categories/' + ${cat.id} + '/delete'" method="post"
                        onsubmit="return confirm('Delete this category? Events using it may be affected.')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                      <i class="bi bi-trash"></i>
                    </button>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/navbar :: chatbot}"></div>
<script th:replace="~{fragments/navbar :: sidebarJs}"></script>
<script>
function updateIcon(val) {
  document.getElementById('iconPreview').className = 'bi ' + val;
}
function selectColor(btn) {
  document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active','border','border-dark','border-3'));
  btn.classList.add('border','border-dark','border-3');
  document.getElementById('colorInput').value = btn.getAttribute('data-color');
}
</script>
</body>
</html>
