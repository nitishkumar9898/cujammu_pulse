# ─── Database & H2 ────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/eventhub}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:password}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ─── Security & Auth ───────────────────────────────────────────────────────
# Default admin credentials for first-time setup
app.default-admin-email=${ADMIN_EMAIL:admin@cujammu.ac.in}
app.default-admin-password=${ADMIN_PASS:}

# ─── Mail Configuration (SMTP) ─────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email Backend (smtp or console)
app.email.backend=${EMAIL_BACKEND:smtp}
# Credential-bearing reset links are sent only to this exact HTTPS host allowlist.
app.security.reset-link-hosts=${APP_RESET_LINK_HOSTS:}

# Reviewed server-side operational chat limits; all instances must use the same values.
app.chat.sender-per-group-per-minute=${CHAT_SENDER_PER_GROUP_PER_MINUTE:20}
app.chat.group-per-minute=${CHAT_GROUP_PER_MINUTE:200}

# ─── AI Chatbot (Gemini) ───────────────────────────────────────────────────
chatbot.ai.enabled=${AI_ENABLED:false}
chatbot.ai.api-key=${AI_API_KEY:}
chatbot.ai.model=${AI_MODEL:}

app.upload.dir=${UPLOAD_DIR:./uploads}
app.media.retention-days=${MEDIA_RETENTION_DAYS:30}
app.media.cleanup-cron=${MEDIA_CLEANUP_CRON:0 30 2 * * *}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ─── Logging ───────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.college.events=DEBUG
logging.file.name=logs/eventhub.log
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n

# ─── Server Configuration ──────────────────────────────────────────────────
server.port=${PORT:8080}
server.error.path=/error
# Campus/private LAN clients are not implicitly trusted reverse proxies.
# Enable native forwarding only with an operator-reviewed exact proxy allowlist.
server.forward-headers-strategy=${PULSE_FORWARD_HEADERS_STRATEGY:none}
server.tomcat.remoteip.internal-proxies=${PULSE_TRUSTED_PROXY_REGEX:(?!)}

# ─── Dev Tools & Optimization ──────────────────────────────────────────────
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.main.banner-mode=console
spring.cache.type=${CACHE_TYPE:none}
