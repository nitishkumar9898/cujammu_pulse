# ==========================================
# H2 DATABASE PROFILE - For Easy Development
# ==========================================
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Or set: spring.profiles.active=h2 in application.properties

# Local development file database. Automated tests must override with an isolated in-memory URL.
spring.datasource.url=jdbc:h2:file:./data/college_events;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (accessible at /h2-console)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA Settings for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable MySQL connection pool warning
spring.datasource.hikari.maximum-pool-size=5
