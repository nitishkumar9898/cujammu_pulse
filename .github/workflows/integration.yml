name: Full Integration Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('college-events/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Maven Verify
        run: mvn -f college-events/pom.xml verify -B -q

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-backend-test-results
          path: college-events/target/surefire-reports/**/*.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cujammu-pulse/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: cujammu-pulse

      - name: TypeScript Check
        run: npm run typecheck
        working-directory: cujammu-pulse

      - name: Run Unit Tests
        run: npm test -- --passWithNoTests
        working-directory: cujammu-pulse

      - name: Build Web
        run: npm run build:web
        working-directory: cujammu-pulse

      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: integration-web-build
          path: cujammu-pulse/dist/

  report:
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    if: always()
    steps:
      - name: Download Backend Test Results
        uses: actions/download-artifact@v4
        with:
          name: integration-backend-test-results
          path: ./backend-test-results

      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: integration-web-build
          path: ./frontend-build

      - name: Integration Report
        run: |
          echo "=== Backend Test Reports ==="
          find ./backend-test-results -name "*.xml" -exec echo "Found: {}" \;
          echo "=== Frontend Build ==="
          find ./frontend-build -type f -exec echo "Built: {}" \;
          echo "Integration pipeline completed successfully."
